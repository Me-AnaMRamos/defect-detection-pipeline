seed: 42

paths:
  dataset_index: data/processed/dataset_index.csv  # built by data/index_dataset.py
  output_dir: outputs

data:
  image_size: 256
  # One model is fitted and evaluated per category (standard MVTec AD protocol).
  categories:
    - tile

model:
  backbone: resnet18
  pretrained: true  # ImageNet weights; the backbone is always frozen

scoring:
  # Scoring methods evaluated on the same embeddings: l2_prototype | mahalanobis | knn
  methods:
    - l2_prototype
    - mahalanobis
    - knn
  cov_eps: 0.01  # ridge added to the covariance diagonal (Mahalanobis)
  knn_k: 5       # neighbours averaged for the kNN score

evaluation:
  # The threshold is calibrated on normal-only validation images so that
  # at most this fraction of normal images is flagged.
  target_fpr: 0.05

runtime:
  batch_size: 32
  num_workers: 2
  device: auto  # auto | cpu | cuda
